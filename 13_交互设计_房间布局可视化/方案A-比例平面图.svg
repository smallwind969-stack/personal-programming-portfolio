<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840"><rect width="920" height="840" fill="#f7f6f0"/><text x="375" y="34" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#344941">方案 A · 并排开黑 + 双人生活</text><text x="375" y="59" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">整体 5×6 m · 左下卫生间 3.3×1.7 m · 平面按比例绘制</text><rect x="125" y="80" width="500" height="600" fill="#eae7dd" stroke="#475b50" stroke-width="4"/><rect x="125" y="510" width="330" height="170" fill="#dce9e1" stroke="#669184" stroke-width="2"/><rect x="135" y="89.99999999999997" width="80" height="400" rx="4" fill="#a47f5f" stroke="#7b8b7c"/><text x="175" y="290" text-anchor="middle" transform="rotate(-90 175 290)" font-family="Microsoft YaHei" font-size="14" fill="#fff">4 m 长桌 × 0.8 m 深</text><rect x="384.99999999999994" y="144.99999999999994" width="215.00000000000003" height="180.00000000000003" rx="4" fill="#c8c2b5" stroke="#7b8b7c"/><text x="492.5" y="234.99999999999997" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#344941">1.8 m 双人床</text><rect x="400" y="412.5" width="200" height="84.99999999999999" rx="4" fill="#84979c" stroke="#7b8b7c"/><text x="500" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#344941">2 m 双人沙发</text><rect x="560" y="500" width="59.999999999999964" height="89.99999999999999" rx="4" fill="#a79581" stroke="#7b8b7c"/><text x="590" y="550" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#344941">衣柜</text><rect x="234" y="419" width="62.000000000000014" height="62.000000000000014" rx="4" fill="#555f62" stroke="#7b8b7c"/><text x="265" y="455" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">座位 1</text><rect x="234" y="339.00000000000006" width="62.000000000000014" height="62.000000000000014" rx="4" fill="#555f62" stroke="#7b8b7c"/><text x="265" y="375.00000000000006" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">座位 2</text><rect x="234" y="259" width="62.000000000000014" height="62.000000000000014" rx="4" fill="#555f62" stroke="#7b8b7c"/><text x="265" y="295" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">座位 3</text><rect x="234" y="179.00000000000003" width="62.000000000000014" height="61.99999999999992" rx="4" fill="#555f62" stroke="#7b8b7c"/><text x="265" y="214.99999999999997" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">座位 4</text><rect x="234" y="99.00000000000004" width="62.000000000000014" height="61.99999999999992" rx="4" fill="#555f62" stroke="#7b8b7c"/><text x="265" y="135" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#ffffff">座位 5</text><rect x="382.5" y="523" width="54.999999999999986" height="69.99999999999999" rx="4" fill="#a9bc82" stroke="#7b8b7c"/><rect x="287.5" y="532" width="45.000000000000014" height="70" rx="4" fill="#edf0ec" stroke="#7b8b7c"/><rect x="137.5" y="567.5" width="85.00000000000001" height="85.00000000000001" rx="4" fill="#90babc" stroke="#7b8b7c"/><rect x="490" y="676" width="90" height="8" fill="#f7f6f0"/><rect x="451" y="560" width="8" height="75" fill="#f7f6f0"/><line x1="185" y1="80" x2="565" y2="80" stroke="#699caa" stroke-width="7"/><text x="535" y="705" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#344941">入口（暂估）</text><text x="290" y="665" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#344941">卫生间 3.3 × 1.7 m</text><text x="345" y="360" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#344941">主通道</text><text x="345" y="388" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#344941">约 0.89–1.04 m</text><text x="500" y="370" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#344941">床侧与沙发之间约 0.88 m</text><text x="500" y="109.99999999999999" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#344941">床侧到窗墙约 0.65 m</text><text x="766" y="112" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#344941">暖灰 × 木色 × 雾蓝</text><text x="766" y="158" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">4 人：每位约 1 m 桌面</text><text x="766" y="188" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">5 人：每位约 0.8 m 桌面</text><text x="766" y="218" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">椅子占位 0.62×0.62 m</text><text x="766" y="248" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">通道按椅子静态占位测算</text><text x="766" y="278" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">移椅 / 起身时需要借用通道</text><text x="766" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">床架总尺寸需实测校准</text><text x="766" y="338" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">沙发沿卫生间隔墙背靠布置</text><text x="766" y="368" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">入口衣柜暂估 0.9 m 宽</text><text x="766" y="398" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">保留现有木门和灰色地砖</text><text x="766" y="428" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">主机设备不计入方案</text><text x="766" y="458" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">门扇开启范围尚未验证</text><text x="460" y="752" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#344941">已确认：整体与卫生间尺寸。门窗、墙厚及家具实际尺寸仍需校准。</text><text x="460" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#344941">这是空间设计方案；床、沙发、桌子位置是拟议布置，未还原为照片现状。</text></svg>